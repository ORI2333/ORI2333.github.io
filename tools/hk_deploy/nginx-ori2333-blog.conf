# 博客站点模板，由 tools/hk_deploy/setup_hk_server.py 渲染后放到
# /etc/nginx/conf.d/<域名>.conf（渲染时替换 listen 8088 / server_name _ / root）。
#
# 2026-10-18 相对旧服务器那份补了四处，都是服务器上已经生效的：
#   1. error_page 404          —— 旧配置 try_files 兜底到 /index.html，任何不存在的路径都返回 200
#   2. http -> https 跳转      —— 旧配置明文 http 也直接返回 200
#   3. 安全响应头              —— nosniff / Referrer-Policy / Permissions-Policy / X-Frame-Options
#   4. /admin/login 限速       —— zone 定义在 setup 脚本生成的 00-ori-blog-http.conf
# 注意：跳转写在 location 里而不是 server 级 if —— server 级 if 跑在 location 选择之前，
# 会把 /.well-known/acme-challenge/ 一起跳走，导致 certbot 续期失败。
server {
    listen 8088;
    server_name _;

    root /var/www/ori2333-blog;
    index index.html;

    access_log /var/log/nginx/ori-blog-access.log ori_blog_main;

    error_page 404 /blog/404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /admin/login {
        limit_req zone=ori_blog_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765/admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8765/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/recommend {
        proxy_pass http://127.0.0.1:8765/api/recommend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /.git {
        return 404;
    }

    location ^~ /.git/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location ^~ /hk/ {
        rewrite ^/hk/(.*)$ /blog/$1 permanent;
    }

    location / {
        if ($scheme != https) {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff|woff2|ttf|otf)$ {
        if ($scheme != https) {
            return 301 https://$host$request_uri;
        }
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }
}

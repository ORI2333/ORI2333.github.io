check_update: false

image:
  avatar: /images/theme/头像.jpg
  banner:
    light: /images/theme/banner-light.webp
    dark: /images/theme/banner-dark.webp
  background:
    light: /images/theme/bg-light.webp
    dark: /images/theme/bg-dark.webp
  favicon: /images/theme/头像.jpg?v=20260329

nav:
  auto_hide: true
  items:
    - label: 首页
      icon: home
      url: /
    - label: 归档
      icon: archive
      url: /archives/
    - label: 分类
      icon: folder-open
      url: /categories/
    - label: 标签
      icon: tags
      url: /tags/
    - label: 关于
      icon: user
      url: /about/

sidebar:
  widgets:
    - about
    - splitter
    - toc
    - category
    - tagcloud
    - posts

posts:
  default_cover: /images/theme/default-cover.webp

footer:
  links:
    - icon: <img class="footer-social-icon footer-icon-email" src="/icons/default-sites/email.svg" alt="Email">
      link: "mailto:ori2333.zh@gmail.com"
      addition: title="Email"
    - icon: <img class="footer-social-icon footer-icon-github" src="/icons/default-sites/github.svg" alt="GitHub">
      link: "https://github.com/ORI2333/"
      addition: target="_blank" rel="nofollow" title="GitHub"
    - icon: <img class="footer-social-icon" src="/icons/default-sites/bilibili.ico" alt="Bilibili">
      link: "https://space.bilibili.com/37400250"
      addition: target="_blank" rel="nofollow" title="Bilibili"
    - icon: <img class="footer-social-icon" src="/icons/default-sites/xiaohongshu.ico" alt="Xiaohongshu">
      link: "https://www.xiaohongshu.com/user/profile/611086e4000000000100a5bf"
      addition: target="_blank" rel="nofollow" title="Xiaohongshu"
  components:
    uptime:
      since: "2025/04/14 00:00:00"
      text: "本站已运行"
    author:
      homepage: "https://github.com/ORI2333"
    additional:
      - - 由 <a href="https://hexo.io" target="_blank" rel="nofollow">Hexo</a> 驱动
        - 在 <a href="https://github.com" target="_blank" rel="nofollow">GitHub</a> 托管
      - - 中国区域由 <a href="https://orizhen.xyz/" target="_blank" rel="nofollow">腾讯云 EdgeOne</a> 加速

share:
  enable: true
  title: "分享这篇文章"
  message: "分享链接会先进入线路选择页，读者可选择稳定访问、腾讯云 CDN 或备用镜像。"
  platforms:
    - name: "选择线路"
      icon: "share-alt"
      color: "#51aded"
      link: "$URL"

donate:
  enable: true
  title: "赞助喵"
  message: "非常感谢您的喜欢！ <i class=\"fa fa-heart\" style=\"color:#d43f57\"></i>"
  qrcode_placeholder: "https://dev.krt.moe/demo-assets/donate.webp"
  platforms:
    - name: "模拟支付"
      icon: "credit-card"
      color: "skyblue"
      qrcode: "example_payment"

copyright_notice:
  in_page:
    enable_at:
      - post
      - page

comments:
  core:
    enable_at: []
    template:
      _shared: |
        <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css">
      index: ""
      post: |
        <div id="waline"></div>
        <script type="module">
          const __COMMENTS_ENABLED = window.__COMMENTS_ENABLED !== false;
          if (!__COMMENTS_ENABLED) {
            const walineEl = document.getElementById('waline');
            if (walineEl) {
              walineEl.outerHTML = '<div class="kr-comments-disabled">评论已关闭（审查中）</div>';
            }
          } else {
            import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
            init({
              el: '#waline',
              serverURL: window.__WALINE_SERVER,
              path: '$PATH',
              dark: "html[data-theme='dark']",
              pageview: false,
              comment: true,
              reaction: [
                '/icons/waline-reaction/weibo_heart_eyes.png',
                '/icons/waline-reaction/weibo_dog_joy.png',
                '/icons/waline-reaction/weibo_dog_consider.png',
                '/icons/waline-reaction/weibo_sob.png',
                '/icons/waline-reaction/weibo_sad.png',
                '/icons/waline-reaction/weibo_look_down.png',
              ],
              lang: 'zh-CN',
              locale: {
                reactionTitle: '感觉如何?',
                reaction0: '大爱',
                reaction1: '期待',
                reaction2: '不明觉厉',
                reaction3: '拳头硬了',
                reaction4: '离谱',
                reaction5: '困了',
              },
            });
          }
        </script>
      page: |
        <div id="waline"></div>
        <script type="module">
          const __COMMENTS_ENABLED = window.__COMMENTS_ENABLED !== false;
          if (!__COMMENTS_ENABLED) {
            const walineEl = document.getElementById('waline');
            if (walineEl) {
              walineEl.outerHTML = '<div class="kr-comments-disabled">评论已关闭（审查中）</div>';
            }
          } else {
            import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
            init({
              el: '#waline',
              serverURL: window.__WALINE_SERVER,
              path: '$PATH',
              dark: "html[data-theme='dark']",
              pageview: false,
              comment: true,
              reaction: [
                '/icons/waline-reaction/weibo_heart_eyes.png',
                '/icons/waline-reaction/weibo_dog_joy.png',
                '/icons/waline-reaction/weibo_dog_consider.png',
                '/icons/waline-reaction/weibo_sob.png',
                '/icons/waline-reaction/weibo_sad.png',
                '/icons/waline-reaction/weibo_look_down.png',
              ],
              lang: 'zh-CN',
              locale: {
                reactionTitle: '感觉如何?',
                reaction0: '大爱',
                reaction1: '期待',
                reaction2: '不明觉厉',
                reaction3: '拳头硬了',
                reaction4: '离谱',
                reaction5: '困了',
              },
            });
          }
        </script>
  count:
    enable_at: []
    template:
      _shared: |
        <script type="module">
          const __COMMENTS_ENABLED = window.__COMMENTS_ENABLED !== false;
          const commentEls = document.querySelectorAll('.waline-comment-count');
          if (!__COMMENTS_ENABLED) {
            commentEls.forEach((el) => {
              const wrapper = el.closest('span') || el;
              wrapper.style.display = 'none';
            });
          } else {
            import { commentCount } from 'https://unpkg.com/@waline/client@v3/dist/comment.js';
            commentCount({
              serverURL: window.__WALINE_SERVER,
              path: window.location.pathname,
            });
          }
        </script>
      index: |
        <span class="waline-comment-count" data-path="$PATH">0</span>
      post: |
        <span class="waline-comment-count" data-path="$PATH">0</span>
  path_hasher: md5


        var shortMatch = normalized.match(/^\/s\/([a-z0-9]+)\/$/i);
        if (shortMatch) return shortMatch[1].toLowerCase();
        var hash = 2166136261;
        var bytes = utf8Bytes(normalized);
        for (var i = 0; i < bytes.length; i += 1) {
          hash ^= bytes[i];
          hash = Math.imul(hash, 16777619) >>> 0;
        }
        var id = hash.toString(36);
        while (id.length < 7) id = "0" + id;

    <script>
    (function(){
      var copyConfig = null;
      function configUrl(){
        var root = window.kr && window.kr.siteRoot ? window.kr.siteRoot : '/';
        return root + 'config.json';
      }
      function loadConfig(){
        fetch(configUrl(), {cache: 'no-store'})
          .then(function(response){ if (!response.ok) throw new Error('copy config load failed'); return response.json(); })
          .then(function(config){ copyConfig = config.copyrightNoticeForCopy || null; })
          .catch(function(){ copyConfig = null; });
      }
      function meta(selector){
        var node = document.querySelector(selector);
        return node && node.content ? node.content : '';
      }
      function copyNotice(){
        if (!copyConfig || !copyConfig.template) return '';
        var link = window.__oriShortUrl ? window.__oriShortUrl() : location.origin.replace(/\/+$/, '') + '/s/';
        return String(copyConfig.template)
          .split('$NEWLINE').join('\n')
          .split('$AUTHOR').join(meta('meta[name="author"]'))
          .split('$TITLE').join(document.title)
          .split('$LINK').join(link);
      }
      document.addEventListener('copy', function(event){
        if (!copyConfig || !copyConfig.enable || !event.clipboardData) return;
        var selected = window.getSelection ? window.getSelection().toString() : '';
        if (selected.length <= Number(copyConfig.threshold || 0)) return;
        event.preventDefault();
        event.stopPropagation();
        event.clipboardData.setData('text/plain', selected + copyNotice());
      }, true);
      loadConfig();
    })();
    </script>
    <script>
    (function(){
      var io = null;
      function setupProgress(){
        var bar = document.getElementById('ori-reading-progress');
        var isPost = document.querySelector('.kratos-page-content.kr-post') !== null;
        if (!isPost) { if (bar) bar.style.display = 'none'; return; }
        if (!bar) { bar = document.createElement('div'); bar.id = 'ori-reading-progress'; document.body.appendChild(bar); }
        bar.style.display = '';
        var raf = null;
        function update(){
          raf = null;
          var doc = document.documentElement;
          var max = doc.scrollHeight - window.innerHeight;
          bar.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0).toFixed(2) + '%';
        }
        if (!window.__oriProgressBound) {
          window.addEventListener('scroll', function(){ if (raf === null) raf = requestAnimationFrame(update); }, {passive:true});
          window.addEventListener('resize', function(){ if (raf === null) raf = requestAnimationFrame(update); }, {passive:true});
          window.__oriProgressBound = true;
        }
        update();
      }
      function setupReveal(){
        document.documentElement.classList.add('ori-anim');
        var items = document.querySelectorAll('.kratos-hentry');
        if (!('IntersectionObserver' in window)) {
          items.forEach(function(el){ el.classList.add('in-view'); });
          return;
        }
        if (io) io.disconnect();
        io = new IntersectionObserver(function(entries){
          entries.forEach(function(en){ if (en.isIntersecting) { en.target.classList.add('in-view'); io.unobserve(en.target); } });
        }, {threshold:.06});
        items.forEach(function(el){ el.classList.remove('in-view'); io.observe(el); });
        setTimeout(function(){
          var vh = window.innerHeight || document.documentElement.clientHeight;
          items.forEach(function(el){
            if (el.classList.contains('in-view')) return;
            var r = el.getBoundingClientRect();
            if (r.top < vh && r.bottom > 0) { el.classList.add('in-view'); io.unobserve(el); }
          });
        }, 1200);
      }
      function setup(){ setupProgress(); setupReveal(); }
      document.addEventListener('DOMContentLoaded', setup);
      window.addEventListener('pjax:complete', function(){ setTimeout(setup, 60); });
    })();
    </script>
    <script>
    (function(){
      var MERMAID_SRC = (window.kr && window.kr.siteRoot ? window.kr.siteRoot : '/') + 'js/vendor/mermaid.min.js';
      var loadPromise = null;
      var seq = 0;
      function ensureMermaid(){
        if (window.mermaid) return Promise.resolve(window.mermaid);
        if (loadPromise === null) {
          loadPromise = new Promise(function(resolve, reject){
            var s = document.createElement('script');
            s.src = MERMAID_SRC;
            s.onload = function(){ resolve(window.mermaid); };
            s.onerror = function(){ loadPromise = null; reject(new Error('mermaid load failed')); };
            document.head.appendChild(s);
          });
        }
        return loadPromise;
      }
      function currentTheme(){
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default';
      }
      function renderPending(){
        var theme = currentTheme();
        var nodes = Array.prototype.slice.call(document.querySelectorAll('.mermaid[data-code]'));
        nodes = nodes.filter(function(n){ return n.getAttribute('data-rendered') !== theme; });
        if (nodes.length === 0) return;
        ensureMermaid().then(function(mermaid){
          mermaid.initialize({ startOnLoad: false, theme: theme, fontFamily: 'inherit' });
          nodes.forEach(function(node){
            var code = decodeURIComponent(node.getAttribute('data-code') || '');
            seq += 1;
            mermaid.render('ori-mermaid-' + seq + '-' + Date.now(), code).then(function(res){
              node.innerHTML = res.svg;
              node.setAttribute('data-rendered', theme);
            }).catch(function(err){
              node.setAttribute('data-rendered', theme);
              node.innerHTML = '<pre class="mermaid-error">' + String(err && err.message ? err.message : err) + '</pre>';
            });
          });
        }).catch(function(){ /* 加载失败时保留源码文本 */ });
      }
      function watchTheme(){
        if (window.__oriMermaidThemeWatched) return;
        window.__oriMermaidThemeWatched = true;
        if ('MutationObserver' in window) {
          new MutationObserver(function(){ renderPending(); })
            .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        }
      }
      function setup(){
        if (document.querySelector('.mermaid[data-code]')) { watchTheme(); renderPending(); }
      }
      document.addEventListener('DOMContentLoaded', setup);
      window.addEventListener('pjax:complete', function(){ setTimeout(setup, 80); });
    })();
    </script>
    <script>
    (function(){
      var KATEX_ROOT = window.kr && window.kr.siteRoot ? window.kr.siteRoot : '/';
      var KATEX_CSS = KATEX_ROOT + 'css/vendor/katex.min.css';
      var KATEX_JS = KATEX_ROOT + 'js/vendor/katex.min.js';
      var stylePromise = null;
      var scriptPromise = null;
      function ensureStyle(){
        if (stylePromise !== null) return stylePromise;
        stylePromise = new Promise(function(resolve, reject){
          var existing = document.getElementById('ori-katex-css');
          if (existing) { resolve(); return; }
          var link = document.createElement('link');
          link.id = 'ori-katex-css';
          link.rel = 'stylesheet';
          link.href = KATEX_CSS;
          link.onload = resolve;
          link.onerror = function(){ stylePromise = null; reject(new Error('KaTeX stylesheet load failed')); };
          document.head.appendChild(link);
        });
        return stylePromise;
      }
      function ensureKaTeX(){
        if (window.katex) return Promise.resolve(window.katex);
        if (scriptPromise !== null) return scriptPromise;
        scriptPromise = new Promise(function(resolve, reject){
          var script = document.createElement('script');
          script.src = KATEX_JS;
          script.onload = function(){ resolve(window.katex); };
          script.onerror = function(){ scriptPromise = null; reject(new Error('KaTeX script load failed')); };
          document.head.appendChild(script);
        });
        return scriptPromise;
      }
      function renderPending(){
        var nodes = Array.prototype.slice.call(document.querySelectorAll('.math[data-tex]'));
        nodes = nodes.filter(function(node){ return node.getAttribute('data-rendered') !== 'true'; });
        if (nodes.length === 0) return;
        Promise.all([ensureStyle(), ensureKaTeX()]).then(function(results){
          var katex = results[1];
          nodes.forEach(function(node){
            try {
              katex.render(decodeURIComponent(node.getAttribute('data-tex') || ''), node, {
                displayMode: node.classList.contains('math-display'),
                throwOnError: false,
                strict: 'warn',
                trust: false,
              });
              node.setAttribute('data-rendered', 'true');
            } catch (error) {
              node.classList.add('math-error');
            }
          });
        }).catch(function(){ /* 资源加载失败时保留 TeX 源码 */ });
      }
      function setup(){
        if (document.querySelector('.math[data-tex]')) renderPending();
      }
      document.addEventListener('DOMContentLoaded', setup);
      window.addEventListener('pjax:complete', function(){ setTimeout(setup, 80); });
    })();
    </script>
